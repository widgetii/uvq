<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UVQ 1.5 — Browser Video Quality Assessment</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; color: #222; }
    h1 { margin-bottom: 0.5rem; }
    .subtitle { color: #666; margin-bottom: 2rem; }
    #error-banner { display: none; background: #fee; border: 1px solid #c00; color: #900; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; }
    #status { margin-bottom: 1rem; color: #555; min-height: 1.5em; }
    #file-input-area { margin-bottom: 1.5rem; }
    input[type="file"] { font-size: 1rem; }
    #results { display: none; margin-top: 1.5rem; }
    .score-display { font-size: 2.5rem; font-weight: bold; text-align: center; padding: 1rem; background: #f0f7ff; border-radius: 8px; margin-bottom: 1rem; }
    .timing { font-size: 0.9rem; color: #666; margin-bottom: 1rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
    th, td { padding: 0.4rem 0.8rem; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #f5f5f5; font-weight: 600; }
    td { text-align: right; font-variant-numeric: tabular-nums; }
    td:first-child { text-align: left; }
    #progress-bar-container { display: none; margin-bottom: 1rem; }
    #progress-bar { width: 100%; height: 8px; border-radius: 4px; }
    video { display: none; }
  </style>
</head>
<body>
  <h1>UVQ 1.5</h1>
  <p class="subtitle">Browser-based video quality assessment (WebGPU / ONNX Runtime)</p>

  <div id="error-banner"></div>
  <div id="status">Initializing...</div>

  <div id="file-input-area" style="display: none;">
    <label for="decode-method">Decode method: </label>
    <select id="decode-method">
      <option value="video-element">&lt;video&gt; element</option>
      <option value="webcodecs">WebCodecs API</option>
    </select>
    <br><br>
    <input type="file" id="video-file" accept="video/*">
  </div>

  <div id="progress-bar-container">
    <progress id="progress-bar" value="0" max="100"></progress>
  </div>

  <div id="results">
    <div class="score-display">Score: <span id="score">—</span> / 5</div>
    <div class="timing" id="timing"></div>
    <h3>Per-frame scores</h3>
    <table>
      <thead id="frame-scores-head"><tr><th>Second</th><th>Score</th><th>Decode time</th><th>Inference time</th></tr></thead>
      <tbody id="frame-scores"></tbody>
    </table>
  </div>

  <video id="video-el" muted></video>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
