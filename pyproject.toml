[project]
name = "uvq"
version = "0.1.0"
description = "Universal Video Quality – no-reference perceptual video quality assessment"
requires-python = ">=3.12"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "tqdm==4.67.1",
    "numpy==2.1.2",
    "pandas==2.2.3",
    "gradio>=4.0",
    "matplotlib>=3.7",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "safetensors>=0.7.0",
]
mlx = [
    "mlx>=0.30.0",
    "safetensors>=0.7.0",
]
onnx = [
    "onnx>=1.17.0",
    "onnxruntime>=1.21.0",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
