name: CI

on:
  push:
    branches: [main, rnd]
  pull_request:
    branches: [main]

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync

      - name: Run CPU tests
        run: uv run pytest tests/ -v --timeout=120 -k "not gpu"

  test-mlx:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Install dependencies
        run: uv sync --group mlx

      - name: Run MLX tests
        run: uv run pytest tests/test_mlx.py tests/test_mlx_cross_backend.py -v --timeout=300 -k "not perf"

  # Template for GPU testing on self-hosted runners.
  # Enable by removing the `if: false` line and configuring a runner with CUDA.
  test-gpu:
    if: false
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync

      - name: Run GPU tests
        run: uv run pytest tests/test_gpu.py -v --timeout=120
